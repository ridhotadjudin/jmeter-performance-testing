name: Performance Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run JMeter tests via Maven
        env: 
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: mvn clean verify -f pom.xml

      - name: Upload JMeter HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report
          path: target/jmeter/reports/
          retention-days: 30

      - name: Upload JMeter Results (JTL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: target/jmeter/results/
          retention-days: 30
